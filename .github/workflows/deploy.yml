name: Deploy to GitHub Pages with Secrets

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate env.js from GitHub Secrets and Variables
        run: |
          node -e '
            const fs = require("fs");
            const env = {
              WORKOUTX_API_KEY: process.env.WORKOUTX_API_KEY || "",
              FIREBASE_API_KEY: process.env.FIREBASE_API_KEY || "",
              FIREBASE_AUTH_DOMAIN: process.env.FIREBASE_AUTH_DOMAIN || "",
              FIREBASE_PROJECT_ID: process.env.FIREBASE_PROJECT_ID || "",
              FIREBASE_STORAGE_BUCKET: process.env.FIREBASE_STORAGE_BUCKET || "",
              FIREBASE_MESSAGING_SENDER_ID: process.env.FIREBASE_MESSAGING_SENDER_ID || "",
              FIREBASE_APP_ID: process.env.FIREBASE_APP_ID || "",
              FIREBASE_MEASUREMENT_ID: process.env.FIREBASE_MEASUREMENT_ID || ""
            };
            fs.writeFileSync("./env.js", "window.__ENV__ = " + JSON.stringify(env, null, 2) + ";\n");
            console.log("Successfully generated secure env.js for GitHub Pages.");
          '
        env:
          WORKOUTX_API_KEY: ${{ secrets.WORKOUTX_API_KEY || vars.WORKOUTX_API_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY || vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN || vars.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET || vars.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID || vars.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || vars.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID || vars.FIREBASE_MEASUREMENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
